services:
  mongo:
    image: mongo:7
    container_name: melodia-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: node:20-alpine
    container_name: melodia-backend
    working_dir: /app/backend
    volumes:
      - ./backend:/app/backend
    command: sh -c "npm install && npm run dev"
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/melodia_store
      JWT_SECRET: ${JWT_SECRET:-clave_solo_para_desarrollo_local}
      JWT_EXPIRES_IN: 5m
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    container_name: melodia-frontend
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:5000/api
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mongo_data:
